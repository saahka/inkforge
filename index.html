<!DOCTYPE html>
<html lang="ru" data-theme="dark">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>InkForge — цифровое рисование</title>
<link rel="stylesheet" href="css/themes/dark.css" />
<link rel="stylesheet" href="css/themes/light.css" />
<link rel="stylesheet" href="css/main.css" />
<link rel="stylesheet" href="css/panels.css" />
<link rel="stylesheet" href="css/tools.css" />
</head>
<body>

<!-- ══════════════════════════════════════════════════════════════
     Корневая сетка приложения: меню / рабочая область / статус
     ══════════════════════════════════════════════════════════════ -->
<div id="app" class="app">

  <!-- ─── Верхняя панель: меню, заголовок документа, системные кнопки ─── -->
  <header class="menubar" id="menubar">
    <div class="menubar__brand">
      <svg viewBox="0 0 24 24" class="brand-mark" aria-hidden="true">
        <path d="M4 18c3-8 6-12 16-13-1 10-5 13-13 16z" fill="currentColor" opacity=".85"/>
      </svg>
      <span>InkForge</span>
    </div>

    <nav class="menubar__menus" id="menus" aria-label="Главное меню">
      <!-- Пункты генерируются в ui/menus.js из описания buildMenuDefinition -->
    </nav>

    <div class="menubar__doc">
      <input id="docTitle" class="doc-title" value="Без имени" spellcheck="false" aria-label="Имя документа" />
      <span class="doc-dirty" id="docDirty" title="Есть несохранённые изменения">•</span>
    </div>

    <div class="menubar__right">
      <button class="icon-btn" id="btnUndo" title="Отменить (Ctrl+Z)" aria-label="Отменить">
        <svg viewBox="0 0 24 24"><path d="M9 14 4 9l5-5"/><path d="M4 9h9a6 6 0 0 1 0 12h-3"/></svg>
      </button>
      <button class="icon-btn" id="btnRedo" title="Повторить (Ctrl+Y)" aria-label="Повторить">
        <svg viewBox="0 0 24 24"><path d="m15 14 5-5-5-5"/><path d="M20 9h-9a6 6 0 0 0 0 12h3"/></svg>
      </button>
      <span class="menubar__sep"></span>
      <button class="icon-btn" id="btnTheme" title="Сменить тему" aria-label="Сменить тему">
        <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="5"/><path d="M12 2v3m0 14v3M2 12h3m14 0h3M4.9 4.9l2.1 2.1m10 10 2.1 2.1M19.1 4.9 17 7m-10 10-2.1 2.1"/></svg>
      </button>
      <button class="icon-btn" id="btnFocus" title="Режим фокуса (F11 / Tab)" aria-label="Режим фокуса">
        <svg viewBox="0 0 24 24"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"/></svg>
      </button>
    </div>
  </header>

  <!-- ─── Рабочая область: тулбар | холст | панели ─── -->
  <div class="workspace" id="workspace">

    <!-- Левая панель: инструменты -->
    <aside class="toolbar" id="toolbar" aria-label="Инструменты">
      <div class="toolbar__spacer"></div>
      <div class="toolbar__group">
        <button class="tool-btn" data-tool="brush" data-key="B" title="Кисть (B)">
          <svg viewBox="0 0 24 24"><path d="M4 20c2 0 3-1 3-3 0-1.5 1-2 2-2s2 .5 2 2c0 2 1 3 3 3-1 2-3 3-6 3-2 0-3-1-4-3z"/><path d="M10 15 19 5a2 2 0 0 1 3 3l-9 9"/></svg>
        </button>
        <button class="tool-btn" data-tool="eraser" data-key="E" title="Ластик (E)">
          <svg viewBox="0 0 24 24"><path d="m5 15 6-6 8 8-4 4H8z"/><path d="M19 21H9"/></svg>
        </button>
        <button class="tool-btn" data-tool="fill" data-key="G" title="Заливка (G)">
          <svg viewBox="0 0 24 24"><path d="M11 3 3 11l8 8 8-8z"/><path d="M20 15c0 1.7 1 3 2 3s2-1.3 2-3c0-1.5-1.5-3.5-2-4-.5.5-2 2.5-2 4z"/></svg>
        </button>
        <button class="tool-btn" data-tool="gradient" data-key="G" title="Градиент (Shift+G)">
          <svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="16" rx="2"/><path d="M3 16h18" opacity=".7"/><path d="M3 12h18" opacity=".5"/><path d="M3 8h18" opacity=".3"/></svg>
        </button>
        <button class="tool-btn" data-tool="eyedropper" data-key="I" title="Пипетка (I)">
          <svg viewBox="0 0 24 24"><path d="m4 20 1-4 9-9 3 3-9 9z"/><path d="m14 7 3-3 3 3-3 3"/></svg>
        </button>
        <div class="toolbar__divider"></div>
        <button class="tool-btn" data-tool="marquee" data-key="M" title="Прямоугольное выделение (M)">
          <svg viewBox="0 0 24 24" stroke-dasharray="3 2"><rect x="4" y="5" width="16" height="14" rx="1"/></svg>
        </button>
        <button class="tool-btn" data-tool="move" data-key="V" title="Перемещение (V)">
          <svg viewBox="0 0 24 24"><path d="M12 3v18M3 12h18"/><path d="m9 6 3-3 3 3M9 18l3 3 3-3M6 9l-3 3 3 3M18 9l3 3-3 3"/></svg>
        </button>
        <div class="toolbar__divider"></div>
        <button class="tool-btn" data-tool="pan" data-key="H" title="Панорамирование (H / Space)">
          <svg viewBox="0 0 24 24"><path d="M9 11V5a1.5 1.5 0 0 1 3 0v6m0-1V4a1.5 1.5 0 0 1 3 0v7m0-2a1.5 1.5 0 0 1 3 0v5a6 6 0 0 1-6 6h-1a5 5 0 0 1-4-2l-3-4a1.6 1.6 0 0 1 2.3-2.2L9 15"/></svg>
        </button>
      </div>

      <!-- Индикатор давления пера -->
      <div class="pressure-meter" id="pressureMeter" title="Давление пера">
        <div class="pressure-meter__bar"><i id="pressureFill"></i></div>
        <span class="pressure-meter__label" id="pressureLabel">—</span>
      </div>
    </aside>

    <!-- Центр: холст -->
    <main class="stage" id="stage">
      <div class="stage__viewport" id="viewport">
        <canvas id="viewCanvas" class="stage__canvas"></canvas>
        <!-- Оверлей: курсор кисти, «муравьи» выделения, предсказание штриха -->
        <canvas id="overlayCanvas" class="stage__overlay"></canvas>
      </div>

      <!-- Плавающая панель масштаба -->
      <div class="zoom-hud">
        <button class="icon-btn icon-btn--sm" id="zoomOut" title="Уменьшить (Ctrl+-)">−</button>
        <button class="zoom-hud__value" id="zoomValue" title="Сбросить масштаб (Ctrl+0)">100%</button>
        <button class="icon-btn icon-btn--sm" id="zoomIn" title="Увеличить (Ctrl+=)">+</button>
        <button class="icon-btn icon-btn--sm" id="zoomFit" title="Вписать (Ctrl+1)">⤢</button>
      </div>
    </main>

    <!-- Правая панель: инструмент, слои, цвет, история -->
    <aside class="dock" id="dock" aria-label="Панели">

      <!-- Панель активного инструмента -->
      <section class="panel" id="panelTool" data-panel="tool">
        <header class="panel__head">
          <h2 class="panel__title" id="toolPanelTitle">Кисть</h2>
          <div class="panel__actions">
            <button class="icon-btn icon-btn--xs" data-collapse title="Свернуть">–</button>
          </div>
        </header>
        <div class="panel__body" id="toolPanelBody"><!-- js/ui/panels.js --></div>
      </section>

      <!-- Панель слоёв -->
      <section class="panel panel--grow" id="panelLayers" data-panel="layers">
        <header class="panel__head">
          <h2 class="panel__title">Слои</h2>
          <div class="panel__actions">
            <button class="icon-btn icon-btn--xs" data-layer="add" title="Новый слой (Ctrl+Shift+N)">＋</button>
            <button class="icon-btn icon-btn--xs" data-layer="duplicate" title="Дублировать (Ctrl+J)">⧉</button>
            <button class="icon-btn icon-btn--xs" data-layer="merge" title="Объединить вниз (Ctrl+E)">⤓</button>
            <button class="icon-btn icon-btn--xs" data-layer="delete" title="Удалить слой">🗑</button>
            <button class="icon-btn icon-btn--xs" data-collapse title="Свернуть">–</button>
          </div>
        </header>
        <div class="panel__body panel__body--flush">
          <div class="layer-props" id="layerProps">
            <div class="field field--row">
              <span class="field__label field__label--w">Непрозр.</span>
              <input type="range" id="layerOpacity" min="0" max="100" value="100" />
              <input type="number" id="layerOpacityNum" min="0" max="100" value="100" class="field__num" />
            </div>
            <div class="field field--row">
              <span class="field__label field__label--w">Режим</span>
              <select id="layerBlend" class="field__select"></select>
            </div>
          </div>
          <ul class="layer-list" id="layerList"></ul>
        </div>
      </section>

      <!-- Панель цвета -->
      <section class="panel" id="panelColor" data-panel="color">
        <header class="panel__head">
          <h2 class="panel__title">Цвет</h2>
          <div class="panel__actions">
            <button class="icon-btn icon-btn--xs" data-swap-colors title="Поменять местами (X)">⇄</button>
            <button class="icon-btn icon-btn--xs" data-collapse title="Свернуть">–</button>
          </div>
        </header>
        <div class="panel__body" id="colorPanelBody"><!-- js/ui/panels.js --></div>
      </section>

      <!-- Панель библиотеки готовых работ -->
      <section class="panel is-collapsed" id="panelLibrary" data-panel="library">
        <header class="panel__head">
          <h2 class="panel__title">Библиотека</h2>
          <div class="panel__actions">
            <button class="icon-btn icon-btn--xs" data-lib="add" title="Сохранить арт в библиотеку (Ctrl+Shift+L)">＋</button>
            <button class="icon-btn icon-btn--xs" data-lib="refresh" title="Обновить список">⟳</button>
            <button class="icon-btn icon-btn--xs" data-collapse title="Развернуть">+</button>
          </div>
        </header>
        <div class="panel__body panel__body--flush">
          <div class="library-toolbar">
            <input class="field__text library-search" id="librarySearch" type="search"
                   placeholder="Поиск по названию" aria-label="Поиск по библиотеке" />
            <select class="field__select library-sort" id="librarySort" aria-label="Сортировка">
              <option value="date">По дате</option>
              <option value="name">По названию</option>
              <option value="size">По размеру</option>
            </select>
          </div>
          <div class="library-grid" id="libraryGrid"></div>
        </div>
      </section>

      <!-- Панель истории -->
      <section class="panel is-collapsed" id="panelHistory" data-panel="history">
        <header class="panel__head">
          <h2 class="panel__title">История</h2>
          <div class="panel__actions">
            <span class="panel__badge" id="historyBadge">0/0</span>
            <button class="icon-btn icon-btn--xs" data-collapse title="Развернуть">+</button>
          </div>
        </header>
        <div class="panel__body panel__body--flush">
          <ul class="history-list" id="historyList"></ul>
        </div>
      </section>

    </aside>
  </div>

  <!-- ─── Нижняя панель: статус ─── -->
  <footer class="statusbar" id="statusbar">
    <span class="status__item" id="statusCoords">0, 0</span>
    <span class="status__sep"></span>
    <span class="status__item" id="statusSize">—</span>
    <span class="status__sep"></span>
    <span class="status__item" id="statusZoom">100%</span>
    <span class="status__sep"></span>
    <span class="status__item" id="statusPointer">мышь</span>
    <div class="status__spacer"></div>
    <span class="status__item status__item--muted" id="statusHint">Space — панорамирование · Ctrl+колесо — зум · [ ] — размер кисти</span>
    <span class="status__sep"></span>
    <span class="status__item status__item--muted" id="statusSave">сохранено</span>
  </footer>
</div>

<!-- Всплывающие элементы (создаются скриптами) -->
<div id="menuLayer" class="menu-layer"></div>
<div id="toasts" class="toasts"></div>
<div id="modalLayer" class="modal-layer" hidden></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
